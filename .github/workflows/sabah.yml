# Günlük yayın akışı (Türkiye saati; GitHub UTC kullanır, Türkiye = UTC+3).
# GitHub zamanlanmış işleri ~30-45 dk geciktirdiği için cron saatleri hedefin 30 dk öncesine ayarlı:
#   06:30 gunaydin  bugünün havası + paylaşılmamış vefatlar
#   09:30 piyasa    döviz, altın, akaryakıt
#   18:00 eczane    bu gecenin nöbetçi eczaneleri
#   21:00 yarin     yarının havası + gün içindeki yeni vefatlar
name: Günlük paylaşımlar

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "30 14 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      mod:
        description: "gunaydin | piyasa | eczane | yarin"
        required: true
        default: piyasa

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hangi paylaşım?
        id: mod
        run: |
          case "${{ github.event.schedule }}" in
            "0 3 * * *") m=gunaydin ;;
            "0 6 * * *") m=piyasa ;;
            "30 14 * * *") m=eczane ;;
            "30 17 * * *") m=yarin ;;
            *) m="${{ inputs.mod }}" ;;
          esac
          echo "mod=$m" >> "$GITHUB_OUTPUT"; echo "Paylaşım: $m"
      - name: Paylaşılmış vefatların hafızasını getir
        uses: actions/cache/restore@v4
        with:
          path: durum
          key: gunluk-durum-${{ github.run_id }}
          restore-keys: gunluk-durum-
      - name: Emoji yazı tipi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji
      - name: Hazırla ve gönder
        env:
          TZ: Europe/Istanbul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python calistir.py "${{ steps.mod.outputs.mod }}"
      - name: Hafızayı kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: durum
          key: gunluk-durum-${{ github.run_id }}
      - name: Görselleri sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paylasim-${{ steps.mod.outputs.mod }}
          path: cikti/
          retention-days: 7
