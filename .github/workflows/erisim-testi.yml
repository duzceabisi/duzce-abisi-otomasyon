# Geçici: GitHub Models ile Türkçe özet testi. Test bitince silinecek.
name: Erisim testi
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/t.py <<'PY'
          import json, os, urllib.request, urllib.error
          for url in ["https://models.github.ai/inference/chat/completions", "https://models.inference.ai.azure.com/chat/completions"]:
              for m in ["openai/gpt-4.1-mini", "gpt-4o-mini"]:
                  body = {"model": m, "temperature": 0.3, "messages": [{"role": "user", "content": "Merhaba, tek kelimeyle cevap ver: Düzce hangi bölgede?"}]}
                  req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                        "Content-Type": "application/json", "Accept": "application/json", "X-GitHub-Api-Version": "2022-11-28"})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          ham = r.read()
                          print("SONUC", url[8:40], m, r.status, r.headers.get("content-type"), ham[:300])
                  except urllib.error.HTTPError as e:
                      print("SONUC", url[8:40], m, "HTTP", e.code, e.read()[:300])
                  except Exception as e:
                      print("SONUC", url[8:40], m, "HATA", e)
          PY
          python3 /tmp/t.py
