# Geçici: sunucuda yalnızca veri toplamayı dener, Telegram'a göndermez. Test bitince silinecek.
name: Erisim testi
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          TZ=Europe/Istanbul python topla.py /tmp/t.json
          python -c 'import json;d=json.load(open("/tmp/t.json"));print("SONUC eksik=",d["eksik"]);e=d.get("eczaneler",{});print("SONUC eczane",e.get("kaynak"),len(e.get("liste",[])),e.get("donem"))'
