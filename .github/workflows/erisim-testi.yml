# Geçici: GitHub Models resmi eylem testi. Test bitince silinecek.
name: Erisim testi
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      models: read
    steps:
      - id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4.1-mini
          system-prompt: "Düzce yerel haber sayfası için yazıyorsun. Yalnızca verilen bilgiyi kullan, bilgi uydurma. Sadece JSON döndür: {\"baslik\": en fazla 60 karakter, \"ozet\": en fazla 2 kısa cümle}"
          prompt: "Başlık: Düzce'de konfeksiyon atölyesinde yangın! Alevlerin yayılması önlendi. Açıklama: Düzce'nin Şıralık Mahallesi'ndeki bir konfeksiyon atölyesinin elektrik panosunda çıkan yangın, itfaiyenin müdahalesiyle büyümeden söndürüldü."
      - run: echo "SONUC ${{ steps.ai.outputs.response }}"
      - name: Doğrudan istek (aynı token, iş düzeyinde izin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -i --max-time 60 https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Düzce hangi bölgede? Tek kelime."}]}' | sed 's/^/SONUC2 /' | head -30
