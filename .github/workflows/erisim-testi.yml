# Geçici: kendi sunucumuzda ücretsiz görsel üretme denemesi (CPU). Test bitince silinecek.
name: Erisim testi
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-lcm-dreamshaper-v7
      - name: Kurulum
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate
          nproc; free -g | head -2
      - name: Üret
        run: |
          cat > /tmp/u.py <<'PY'
          import time, torch
          from diffusers import DiffusionPipeline
          t = time.time()
          pipe = DiffusionPipeline.from_pretrained("SimianLuo/LCM_Dreamshaper_v7", torch_dtype=torch.float32, safety_checker=None)
          pipe.to("cpu"); torch.set_num_threads(4)
          print("SONUC model yüklendi", round(time.time() - t), "sn")
          istemler = {
            "kaza": "cinematic night scene, empty wet asphalt road intersection, red and blue emergency lights glowing in fog, traffic lights, moody, no people, no text",
            "yangin": "cinematic night scene, industrial building silhouette with orange fire glow and smoke in the sky, firefighter truck lights in distance, moody, no people, no text",
            "deprem": "cinematic dramatic scene, cracked ground and asphalt, dust in golden light, small town houses in background, moody, no people, no text",
          }
          for ad, istem in istemler.items():
              t = time.time()
              img = pipe(prompt=istem, num_inference_steps=4, guidance_scale=8.0, width=576, height=1024).images[0]
              img.save(f"/tmp/out-{ad}.png"); print("SONUC", ad, round(time.time() - t), "sn")
          PY
          python /tmp/u.py
      - uses: actions/upload-artifact@v4
        with:
          name: gorseller
          path: /tmp/out-*.png
