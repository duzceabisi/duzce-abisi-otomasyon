# Haber kartları için temsili arka plan kütüphanesini üretir ve depoya kaydeder (elle başlatılır).
name: Arka plan kütüphanesi
on:
  workflow_dispatch:
    inputs:
      kategori:
        description: "Boş = hepsi; ya da tek kategori (kaza, yangin, deprem, ...)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-lcm-dreamshaper-v7
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate
      - run: python arkaplan_uret.py ${{ inputs.kategori }}
      - name: Depoya kaydet
        run: |
          git config user.name "Düzce Abisi"; git config user.email "343234096+duzceabisi@users.noreply.github.com"
          git add arkaplan && git commit -m "Arka plan kütüphanesi güncellendi" && git push || echo "değişiklik yok"
