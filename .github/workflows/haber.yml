# Yaklaşık 5 dakikada bir: haberler, iş ilanları, deprem; saati gelen zamanlı paylaşımlar (burç, tarihte bugün, özetler).
name: Haber takibi

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      gorev:
        description: "Boş = normal tarama. onizleme = günün tüm akışını hemen gönder (hafızaya yazmaz). Ya da tek görev: burc | market | tarihte | is_ozet | ozet | etkinlik_hafta | hafta_sonu"
        required: false
        default: ""

concurrency:
  group: haber-takip      # iki tarama aynı anda çalışıp aynı haberi iki kez göndermesin
  cancel-in-progress: false

jobs:
  tara:
    # Yerel sunucu devredeyken (depo değişkeni CALISMA_YERI=yerel) zamanlanmış çalışmalar atlanır; elle başlatma yine çalışır
    if: github.event_name != 'schedule' || vars.CALISMA_YERI != 'yerel'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Emoji yazı tipi (önemli haber kartları için)
        run: sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null 2>&1 || true
      - name: Önceki taramanın hafızasını getir
        uses: actions/cache/restore@v4
        with:
          path: durum
          key: haber-durum-${{ github.run_id }}
          restore-keys: haber-durum-
      - name: Tara ve gönder
        timeout-minutes: 42   # aşılırsa bile hafıza adımı çalışsın (tekrar gönderim olmasın)
        env:
          TZ: Europe/Istanbul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # GitHub zamanlanmış işleri ~30 dk'da bir başlatıyor; her çalışmada 5 dk arayla 6 tur tarama yapılır
          # (elle bir görev ya da önizleme istenirse tek tur)
          TUR=6; [ -n "${{ inputs.gorev }}" ] && TUR=1
          for i in $(seq 1 $TUR); do
            if [ $SECONDS -gt 1920 ]; then echo "süre doldu, kalan turlar sonraki çalışmada"; break; fi
            echo "=== tur $i/$TUR $(date +%H:%M)"
            python haber_takip.py || echo "::error::haber_takip başarısız"
            python is_ilanlari.py || echo "::error::is_ilanlari başarısız"
            python deprem.py || echo "::error::deprem başarısız"
            python zamanli.py ${{ inputs.gorev }} || echo "::error::zamanli başarısız"
            if [ $i -lt $TUR ]; then sleep 270; fi
          done
      - name: Hafızayı kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: durum
          key: haber-durum-${{ github.run_id }}
