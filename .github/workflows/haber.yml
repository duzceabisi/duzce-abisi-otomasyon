# 10 dakikada bir: haberler, iş ilanları, deprem; saati gelen zamanlı paylaşımlar (burç, tarihte bugün, özetler).
name: Haber takibi

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      gorev:
        description: "Boş = normal tarama. Ya da hemen çalıştır: burc | market | tarihte | is_ozet | ozet | etkinlik_hafta | hafta_sonu"
        required: false
        default: ""

concurrency:
  group: haber-takip      # iki tarama aynı anda çalışıp aynı haberi iki kez göndermesin
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Emoji yazı tipi (önemli haber kartları için)
        run: sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null 2>&1 || true
      - name: Önceki taramanın hafızasını getir
        uses: actions/cache/restore@v4
        with:
          path: durum
          key: haber-durum-${{ github.run_id }}
          restore-keys: haber-durum-
      - name: Tara ve gönder
        env:
          TZ: Europe/Istanbul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python haber_takip.py || echo "::error::haber_takip başarısız"
          python is_ilanlari.py || echo "::error::is_ilanlari başarısız"
          python deprem.py || echo "::error::deprem başarısız"
          python zamanli.py ${{ inputs.gorev }} || echo "::error::zamanli başarısız"
      - name: Hafızayı kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: durum
          key: haber-durum-${{ github.run_id }}
